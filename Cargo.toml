[workspace]
resolver = "3"
members = ["crates/moirai-core", "crates/moirai"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# the oldest toolchain every dependency builds with
rust-version = "1.90"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1

# Keep debug builds usable: the physics loops are hot.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
